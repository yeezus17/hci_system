<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
    /* SweetAlert2 Modal Architectural Light Overrides */
    .swal2-popup {
        background: #FFFFFF !important;
        border: 1px solid #E2E8F0 !important;
        border-radius: 2rem !important;
        box-shadow: 0 20px 50px rgba(10, 34, 64, 0.08) !important;
        padding: 2.5rem 2rem !important;
    }
    .swal2-title { 
        color: #0A2240 !important; 
        font-family: 'DM Sans', sans-serif !important; 
        font-weight: 900 !important;
        text-transform: uppercase !important;
        letter-spacing: -0.03em !important;
    }
    .swal2-html-container {
        color: #64748B !important;
        font-family: 'DM Sans', sans-serif !important;
        font-weight: 600 !important;
        font-size: 0.875rem !important;
        line-height: 1.6 !important;
    }
    .swal2-confirm {
        background-color: #0052B4 !important;
        color: #FFFFFF !important;
        font-family: 'DM Sans', sans-serif !important;
        font-size: 10px !important;
        font-weight: 900 !important;
        text-transform: uppercase !important;
        letter-spacing: 0.2em !important;
        border-radius: 0.85rem !important;
        padding: 14px 32px !important;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1) !important;
    }
    .swal2-confirm:hover {
        background-color: #0A2240 !important;
        box-shadow: 0 8px 20px rgba(10, 34, 64, 0.15) !important;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        {% if messages %}
            {% for message in messages %}
                Swal.fire({
                    icon: "{% if message.tags == 'error' %}error{% else %}success{% endif %}",
                    title: "{% if message.tags == 'error' %}Oups...{% else %}Succès !{% endif %}",
                    text: "{{ message|escapejs }}",
                    confirmButtonText: 'Continuer',
                    iconColor: "{% if message.tags == 'error' %}#EF4444{% else %}#0052B4{% endif %}",
                    buttonsStyling: false,
                    customClass: {
                        confirmButton: 'swal2-confirm'
                    }
                });
            {% endfor %}
        {% endif %}
    });
</script>
